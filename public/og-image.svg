<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#f97316"/>
  <!-- Grid lines (subtle) -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <!-- Logo mark -->
  <rect x="80" y="200" width="56" height="56" rx="10" fill="#f97316"/>
  <text x="108" y="240" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">I</text>
  <!-- Brand name -->
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">IWILLBUILD</text>
  <!-- Tagline -->
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">Construction management portal</text>
  <!-- Feature pills -->
  <rect x="80" y="430" width="130" height="36" rx="18" fill="#1e3a5f"/>
  <text x="145" y="453" font-family="Arial, sans-serif" font-size="16" fill="#93c5fd" text-anchor="middle">Projects</text>
  <rect x="224" y="430" width="110" height="36" rx="18" fill="#1e3a5f"/>
  <text x="279" y="453" font-family="Arial, sans-serif" font-size="16" fill="#93c5fd" text-anchor="middle">Safety</text>
  <rect x="348" y="430" width="120" height="36" rx="18" fill="#1e3a5f"/>
  <text x="408" y="453" font-family="Arial, sans-serif" font-size="16" fill="#93c5fd" text-anchor="middle">Estimates</text>
  <rect x="482" y="430" width="100" height="36" rx="18" fill="#1e3a5f"/>
  <text x="532" y="453" font-family="Arial, sans-serif" font-size="16" fill="#93c5fd" text-anchor="middle">Fleet</text>
  <rect x="596" y="430" width="100" height="36" rx="18" fill="#1e3a5f"/>
  <text x="646" y="453" font-family="Arial, sans-serif" font-size="16" fill="#93c5fd" text-anchor="middle">Forms</text>
  <!-- Domain -->
  <text x="1120" y="590" font-family="Arial, sans-serif" font-size="22" fill="#475569" text-anchor="end">iwillbuild.com</text>
</svg>
