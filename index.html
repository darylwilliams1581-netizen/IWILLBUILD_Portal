  <head>

    <script>
      // Declare SOSAlertPopup as a var so it exists as a bare identifier
      // on the global scope. ES modules in strict mode cannot see window.*
      // properties as bare names, but a var in a classic script IS visible
      // as a bare name from any script on the page (including module scripts
      // that share the same global object). This stops the frozen HMR
      // snapshot of RootLayout.tsx (?t=1783772358219) from throwing a
      // ReferenceError when it references SOSAlertPopup at line 122.
      var SOSAlertPopup = function SOSAlertPopup() { return null; };
    </script>
    <script>
      (function () {
        // ── SOSAlertPopup frozen-snapshot guard v14 ───────────────────────────
        var LS_KEY = 'html_sos_reload_ts';
        var SS_KEY = 'sos_boundary_triggered';
        var WINDOW_MS = 3000; // short window — only block tight reload loops

        function recentReload() {
          try {
            var ts = parseInt(localStorage.getItem(LS_KEY) || '0', 10);
            return ts && (Date.now() - ts < WINDOW_MS);
          } catch (_) { return false; }
        }

        function doReload() {
          if (recentReload()) return;
          try { localStorage.setItem(LS_KEY, String(Date.now())); } catch (_) {}
          try { sessionStorage.removeItem(SS_KEY); } catch (_) {}
          window.location.reload();
        }

        // Layer 1: React boundary set the flag on previous render
        try {
          if (sessionStorage.getItem(SS_KEY) === '1') {
            sessionStorage.removeItem(SS_KEY);
            doReload();
          }
        } catch (_) {}

        // Layer 2: module-evaluation ReferenceError (fires before React)
        window.addEventListener('error', function (e) {
          if (e.message && e.message.indexOf('SOSAlertPopup') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            doReload();
          }
        }, true);

        // Layer 3: callable by React boundaries
        window.__sosBoundaryTrigger = function () {
          try { sessionStorage.setItem(SS_KEY, '1'); } catch (_) {}
          doReload();
        };
      })();
    </script>
