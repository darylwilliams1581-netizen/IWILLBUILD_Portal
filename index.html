<!doctype html>
<html lang="en">
  <!-- cache-bust: v9 -->
  <head>
    <meta charset="UTF-8" />
    <!-- Auto-reload if the browser holds the frozen RootLayout HMR snapshot.
         The frozen module (t=1783772358219) has SOSAlertPopup as a bare
         identifier — cannot be patched. Hard reload clears the module registry.
         v9: unconditionally clears ALL prior guard keys on every page load so
         the reload fires every time the error surfaces, not just once. -->
    <script>
      (function () {
        // Clear ALL stale-reload guard keys unconditionally on every page load.
        // This means the reload fires every time the error surfaces — the guard
        // only prevents a reload loop within the same page load, not across loads.
        var toRemove = [];
        for (var i = 0; i < sessionStorage.length; i++) {
          var k = sessionStorage.key(i);
          if (k && k.indexOf('rl_stale_reloaded_') === 0) toRemove.push(k);
        }
        for (var j = 0; j < toRemove.length; j++) sessionStorage.removeItem(toRemove[j]);

        var KEY = 'rl_stale_reloaded_v9';
        window.addEventListener('error', function (e) {
          if (e.message && e.message.indexOf('SOSAlertPopup') !== -1) {
            if (!sessionStorage.getItem(KEY)) {
              sessionStorage.setItem(KEY, '1');
              window.location.reload(true);
            }
          }
        }, true);
      })();
    </script>
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.has('airoShareToken')) {
            u.searchParams.delete('airoShareToken');
            history.replaceState(null, '', u.toString());
          }
        } catch (e) {}
      })();
    </script>
    <meta name="referrer" content="same-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IWILLBUILD" />
    <meta name="theme-color" content="#ff6b00" />
    <link rel="manifest" href="/manifest.json" />
    <!--app-head-->
    <script src="/airo-video-slots.js"></script>
    <script src="/airo-logo-orientation.js"></script>
  </head>

    <div id="app" class="fs-unmask-airo-app-builder"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/analytics.js"></script>
  </body>
</html>
