        var GUARD_MS = 5000;

        // also with formatted strings like "The above error occurred in...".
        // We intercept both. Also patch console.warn as a belt-and-suspenders.

          console[method] = function () {
            var args = Array.prototype.slice.call(arguments);
            var hit = args.some(function (a) {
              if (!a) return false;
              if (isSos(a.message)) return true;
              if (isSos(a.stack)) return true;
              try { if (isSos(String(a))) return true; } catch (_) {}
