name: Android APK Build

# Triggers:
#   - Push to main branch (auto-build)
#   - Manual trigger from GitHub Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Build web assets ─────────────────────────────────────────────────────
      # Builds the React app into dist/client/ which Capacitor copies into Android
      - name: Build web assets
        run: npx vite build
        env:
          NODE_ENV: production

      # ── Capacitor sync ───────────────────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── Java ─────────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK ──────────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Keystore (release builds only) ───────────────────────────────────────
      # For release builds, decode the base64 keystore from GitHub secrets.
      # See ANDROID_KEYSTORE.md for how to generate and encode your keystore.
      - name: Decode keystore
        if: github.event.inputs.release_type == 'release' || github.event_name == 'push'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/iwillbuild.keystore
        continue-on-error: true  # skip if secret not yet configured

      # ── Build debug APK ──────────────────────────────────────────────────────
      - name: Build debug APK
        if: github.event.inputs.release_type == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── Build release APK ────────────────────────────────────────────────────
      - name: Build release APK
        if: github.event.inputs.release_type == 'release' || github.event_name == 'push'
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=iwillbuild.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
        continue-on-error: true  # falls back to debug if keystore not configured

      # ── Fallback debug build if release signing failed ────────────────────────
      - name: Build debug APK (fallback)
        if: failure()
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload APK artifact ──────────────────────────────────────────────────
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: iwillbuild-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: iwillbuild-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30

      # ── Create GitHub Release (on push to main with release APK) ─────────────
      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-android-${{ github.run_number }}
          name: IWILLBUILD Android v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          body: |
            ## IWILLBUILD Android APK

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}

            ### Install Instructions
            1. Download `app-release.apk` or `app-debug.apk` below
            2. On your Android device: Settings → Security → Install unknown apps → Allow
            3. Open the downloaded APK and tap Install

            ### What's in this build
            ${{ github.event.head_commit.message }}
          files: |
            android/app/build/outputs/apk/release/app-release*.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
